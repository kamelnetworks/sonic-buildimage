# Welcome to the chrony configuration file. See chrony.conf(5) for more
# information about usable directives.

# Include configuration files found in /etc/chrony/conf.d.
confdir /etc/chrony/conf.d

server 10.20.30.50 key 42 iburst version 3

pool pool.ntp.org iburst version 3




# Use time sources from DHCP.
sourcedir /run/chrony-dhcp

# Use NTP sources found in /etc/chrony/sources.d.
sourcedir /etc/chrony/sources.d

# This directive specify the location of the file containing ID/key pairs for
# NTP authentication.
keyfile /etc/chrony/chrony.keys

# This directive specify the file into which chronyd will store the rate
# information.
driftfile /var/lib/chrony/chrony.drift

# Save NTS keys and cookies.
ntsdumpdir /var/lib/chrony

# Uncomment the following line to turn logging on.
#log tracking measurements statistics

# Log files location.
logdir /var/log/chrony

# Stop bad estimates upsetting machine clock.
maxupdateskew 100.0

# Let the kernel keep the real-time clock in sync: every 11 minutes while the
# system clock is synchronised, it copies the system time to the RTC. It also
# makes chronyd clear the kernel's STA_UNSYNC flag once synchronised, which is
# what monitoring reads (node_exporter's node_timex_sync_status, timedatectl).
# It can't be used along with 'rtcfile' (chronyd refuses to start with both),
# so chrony's own RTC tracking (rtcfile/hwclockfile/rtconutc/rtcautotrim) is
# not used.
rtcsync

# Step the system clock instead of slewing it if the adjustment is larger than
# the threshold, but only in the first three clock updates after chronyd
# starts (at boot, or when hostcfgd restarts chrony after an NTP config
# change). Every later offset is slewed. Without this, a clock that boots
# hours off (bad RTC) is slewed at 83 ms/s and takes days to converge, with
# the kernel reporting it unsynchronised the whole time (#122).
makestep 15 3

# Get TAI-UTC offset and leap seconds from the system tz database.
# This directive must be commented out when using time sources serving
# leap-smeared time.
leapsectz right/UTC
