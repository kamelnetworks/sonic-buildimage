#!/bin/bash
# Sourced by config_syncd() in sonic-sairedis syncd_init_common.sh, after the
# ASIC-specific arguments are set.
#
# Run syncd with --enableAttrVersionCheck (-a) so SaiDiscovery skips
# attributes newer than libsai's API version. Without it, the Teralynx SAI
# (innovium-sai 7.0.1 and 8.1.0) segfaults when discovery asks for
# SAI_PORT_ATTR_QOS_QUEUE_TO_VC_MAP: ifcs_sai_shim_get_port indexes its
# attribute table past the end (kamelnetworks/sonic-buildimage#60).
# Remove this once the SAI bounds-checks unknown attribute ids.

case " $CMD_ARGS " in
    *" -a "*) ;;
    *) CMD_ARGS+=" -a" ;;
esac
